<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Godot RPG · 网页版</title>
<link rel="stylesheet" href="style.css">

<!-- AllinONE UGC 集成样式（道具栏 + Toast 通知） -->
<style>
  /* AllinONE UGC 道具栏 */
  .ugc-bar {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; padding: 8px 16px;
    background: rgba(0,0,0,0.85); border-radius: 12px; z-index: 9999;
    font-family: system-ui; min-height: 40px;
  }
  .ugc-label { color: #4caf50; font-weight: bold; font-size: 12px; margin-right: 4px; }
  .ugc-item {
    padding: 4px 10px; background: #333; border-radius: 8px; cursor: pointer;
    color: #fff; font-size: 13px; border: 1px solid #555; transition: all 0.2s;
  }
  .ugc-item:hover { background: #4caf50; border-color: #4caf50; }
  .ugc-empty { color: #666; font-size: 12px; }
  /* Toast 通知 */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
    padding: 10px 20px; background: rgba(0,0,0,0.9); color: #fff; border-radius: 8px;
    font-size: 14px; z-index: 10000; border-left: 4px solid #4caf50;
    transition: transform 0.3s ease; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="1280" height="720"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="bars">
      <div class="bar hp"><div class="fill" id="hpfill"></div><span id="hptext"></span></div>
      <div class="bar mp"><div class="fill" id="mpfill"></div><span id="mptext"></span></div>
      <div class="bar exp"><div class="fill" id="expfill"></div><span id="exptext"></span></div>
    </div>
    <div class="stats-top"><span id="lvltext"></span> <span id="cointxt"></span> <span id="pointtxt"></span></div>
    <div id="hint">移动 WASD/方向键 · 攻击 空格 · 技能 1-4 · 交互 E · 背包 I · 装备 O · 技能 K · 任务 L · 属性 U · 暂停 Esc</div>
  </div>

  <!-- 通用面板 -->
  <div id="panel" class="overlay hidden"></div>

  <!-- 暂停 -->
  <div id="pause" class="overlay hidden">
    <div class="menu">
      <h2>暂停</h2>
      <button data-act="pause_resume">继续游戏</button>
      <button data-act="pause_save">保存进度</button>
      <button data-act="pause_title">返回标题</button>
    </div>
  </div>

  <!-- 死亡 -->
  <div id="gameover" class="overlay hidden">
    <div class="menu">
      <h2>你倒下了……</h2>
      <button data-act="go_respawn">原地复活</button>
      <button data-act="go_title">返回标题</button>
    </div>
  </div>

  <!-- 标题 -->
  <div id="title" class="overlay hidden">
    <div class="menu wide">
      <h1>Godot RPG · 网页版</h1>
      <p class="sub">选择存档槽开始游戏　·　进度保存在浏览器本地</p>
      <div id="slots"></div>
    </div>
  </div>

  <!-- 加载 -->
  <div id="loading" class="overlay">
    <div class="menu">
      <h2>加载资源中…</h2>
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
      <div id="ploading">0%</div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>

<script src="data/gamedata.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/state.js"></script>
<script src="js/entities.js"></script>
<script src="js/main.js"></script>
<script src="js/gun.js"></script>
<!-- 宠物系统（默认关闭，不改动正式游戏默认行为；访问 index.html?pet=1 启用，或手动 RPG.RPGPet.install(RPG.game)） -->
<script src="js/pet.js"></script>
<!-- 地雷系统（默认关闭；访问 index.html?mine=1 启用，或手动 RPG.RPGMine.install(RPG.game)，或作为 UGC 道具 rpg-mine.json 启用） -->
<script src="js/mine.js"></script>

<!-- ============ AllinONE 平台集成 ============ -->
<div id="ugc-bar" class="ugc-bar">
  <span class="ugc-label">PROPS</span>
  <span class="ugc-empty">No items yet</span>
</div>
<div id="toast-container"></div>

<script>
(function() {
  'use strict';

  // ============ Toast 提示 ============
  function showToast(msg, type) {
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    if (type === 'error') toast.style.borderColor = '#f44336';
    else if (type === 'info') toast.style.borderColor = '#2196f3';
    document.getElementById('toast-container').appendChild(toast);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { toast.classList.add('show'); });
    });
    setTimeout(function() {
      toast.classList.remove('show');
      setTimeout(function() { toast.remove(); }, 400);
    }, 3000);
  }

  // ============ 内置效果表（已针对本 RPG 实现）============
  // 运行时惰性引用 RPG.game（boot() 在 window load 后才创建实例）
  function _game() { return (typeof RPG !== 'undefined' && RPG.game) ? RPG.game : null; }
  var EFFECT_HANDLERS = {
    add_coins: function(params) {
      var n = Math.max(0, Math.floor(params.amount || 10));
      RPG.GameData.coins += n;
      RPG.EventBus.emit('coins_changed');
      return { message: '💰 +' + n + ' 金币' };
    },
    heal: function(params) {
      var g = _game(); if (!g || !g.player) return { error: true, message: '游戏尚未开始' };
      var n = Math.max(1, Math.floor(params.amount || 30));
      g.player.heal(n);
      return { message: '❤️ 恢复 ' + n + ' 生命' };
    },
    restore_mp: function(params) {
      var g = _game(); if (!g || !g.player) return { error: true, message: '游戏尚未开始' };
      var n = Math.max(1, Math.floor(params.amount || 30));
      g.player.addMana(n);
      return { message: '🔵 恢复 ' + n + ' 法力' };
    },
    full_heal: function(params) {
      var g = _game(); if (!g || !g.player) return { error: true, message: '游戏尚未开始' };
      g.player.heal(1e9); g.player.addMana(1e9);
      return { message: '✨ 生命与法力已全满' };
    },
    add_exp: function(params) {
      var g = _game(); if (!g || !g.player) return { error: true, message: '游戏尚未开始' };
      var n = Math.max(1, Math.floor(params.amount || 50));
      g.player.addExp(n);
      return { message: '⭐ +' + n + ' 经验' };
    },
    add_item: function(params) {
      var path = params.item || params.itemId;
      if (!path) return { error: true, message: '缺少道具ID' };
      var amt = Math.max(1, Math.floor(params.amount || 1));
      RPG.Inventory.addItem(path, amt);
      RPG.EventBus.emit('inventory_changed');
      return { message: '🎒 获得道具 x' + amt };
    },
    apply_enchant: function(params) {
      var g = _game();
      if (!g || !g.player) return { error: true, message: '游戏尚未开始' };
      return g.applyEnchant(params || {});
    }
  };

  // ============ 吸收 pet.js / mine.js 自注册的 UGC 道具效果 ============
  // 兜底：即使线上平台下发的道具载荷未携带 effectCode，这些 effect（summon_cat、
  // mine_* 等）也已由对应脚本自注册，这里合并进 EFFECT_HANDLERS 后，
  // useCustomPowerUp 可直接命中，避免 “未找到效果”。（脚本加载顺序满足：
  // pet.js / mine.js 在 index.html 末尾 IIFE 之前已执行，队列已就绪。）
  if (typeof window !== 'undefined' && window.__ALLINONE_EFFECT_DEFS) {
    Object.keys(window.__ALLINONE_EFFECT_DEFS).forEach(function (k) {
      if (!EFFECT_HANDLERS[k]) EFFECT_HANDLERS[k] = window.__ALLINONE_EFFECT_DEFS[k];
    });
  }

  // ============ effectCode 沙箱引擎 ============
  var _dynamicHandlerCache = {};
  function registerDynamicEffect(effectName, effectCodeStr) {
    if (EFFECT_HANDLERS[effectName]) return true;
    if (_dynamicHandlerCache[effectName]) {
      EFFECT_HANDLERS[effectName] = _dynamicHandlerCache[effectName];
      return true;
    }
    if (!effectCodeStr || typeof effectCodeStr !== 'string') return false;
    if (effectCodeStr.length > 4000) return false;

    var blocked = [
      'eval(', 'new function', 'import(', 'require(', '__proto__',
      'prototype', 'constructor', 'window.', 'document.',
      'parent.', 'top.', 'globalthis', 'self.',
      'fetch(', 'xmlhttprequest', 'websocket', 'worker(',
      'localstorage', 'sessionstorage', 'cookie',
      'alert(', 'confirm(', 'prompt('
    ];
    var lowerCode = effectCodeStr.toLowerCase();
    for (var i = 0; i < blocked.length; i++) {
      if (lowerCode.indexOf(blocked[i]) !== -1) return false;
    }

    try {
      var sandboxFn = new Function(
        'game', 'GameData', 'Inventory', 'EventBus', 'Math', 'JSON', 'console',
        'return (' + effectCodeStr + ');'
      );
      var rawHandler = sandboxFn(
        _game() || {}, RPG.GameData, RPG.Inventory, RPG.EventBus, Math, JSON, console
      );
      if (typeof rawHandler !== 'function') return false;

      var wrappedHandler = function(params) {
        try { return rawHandler(params) || { message: '效果已执行' }; }
        catch (e) { return { error: true, message: '效果出错: ' + (e.message || e) }; }
      };
      _dynamicHandlerCache[effectName] = wrappedHandler;
      EFFECT_HANDLERS[effectName] = wrappedHandler;
      return true;
    } catch (e) { return false; }
  }

  // ============ UGC 道具库存 ============
  var customPowerUps = [];

  function renderCustomPowerUps() {
    var bar = document.getElementById('ugc-bar');
    bar.innerHTML = '';
    var label = document.createElement('span');
    label.className = 'ugc-label';
    label.textContent = 'PROPS';
    bar.appendChild(label);
    if (customPowerUps.length === 0) {
      var empty = document.createElement('span');
      empty.className = 'ugc-empty';
      empty.textContent = 'No items yet';
      bar.appendChild(empty);
      return;
    }
    customPowerUps.forEach(function(item, index) {
      var el = document.createElement('span');
      el.className = 'ugc-item';
      el.textContent = (item.icon || '⚡') + ' ' + item.name;
      el.title = item.description || item.effect;
      el.onclick = function() { useCustomPowerUp(index); };
      bar.appendChild(el);
    });
  }

  function useCustomPowerUp(index) {
    var item = customPowerUps[index];
    if (!item) return;
    if (item.effectCode && !EFFECT_HANDLERS[item.effect]) {
      if (!registerDynamicEffect(item.effect, item.effectCode)) {
        showToast('❌ 效果注册失败', 'error');
        return;
      }
    }
    var handler = EFFECT_HANDLERS[item.effect];
    if (handler) {
      var result = handler(item.params);
      if (result && result.message) showToast(result.message, result.error ? 'error' : 'success');
    } else {
      showToast('❌ 未找到效果: ' + item.effect, 'error');
    }
    customPowerUps.splice(index, 1);
    renderCustomPowerUps();
  }

  // ============ 接收平台道具（双通道）============
  // 通道 1: EXTENSION_VOUCHER postMessage（UGC 道具工坊下发）
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'EXTENSION_VOUCHER') {
      var v = e.data.voucher;
      if (!v || !v.data) return;
      var data = v.data;
      if (data.effect) {
        customPowerUps.push({
          id: v.id || ('ugc_' + Date.now()),
          name: data.name || (data.effect + '道具'),
          effect: data.effect,
          params: data.params || {},
          description: data.description || '',
          effectCode: data.effectCode || null,
          icon: data.icon || '⚡'
        });
        renderCustomPowerUps();
        showToast('🎁 获得道具: ' + (data.name || data.effect), 'success');
      }
    }
    if (e.data && e.data.type === 'REDEEM_RESULT' && e.data.data && e.data.data.success) {
      showToast('✅ 兑换成功', 'success');
    }
  });

  // 通道 2: allinone-item-redeemed CustomEvent（兑换码兑换下发）
  // ⚠️ detail.effectType 固定为 'custom'（占位），真实效果名在 detail.itemId
  var _redeemedIds = {};
  function handleRedeemedItem(detail) {
    var key = detail.code || detail.itemId;
    if (_redeemedIds[key]) return;  // 去重
    _redeemedIds[key] = true;

    var voucherData = detail.voucherData || {};
    var realEffect = (voucherData.effect && voucherData.effect !== 'custom')
      ? voucherData.effect : null;
    if (!realEffect && detail.itemId && detail.itemId !== 'custom') {
      realEffect = detail.itemId;
    }
    if (!realEffect) return;

    customPowerUps.push({
      id: key || ('ugc_' + Date.now()),
      name: voucherData.name || detail.itemName || '道具',
      effect: realEffect,
      params: voucherData.params || detail.effects || {},
      description: voucherData.description || '',
      effectCode: voucherData.effectCode || null,
      icon: voucherData.icon || '⚡'
    });
    renderCustomPowerUps();
    showToast('🎁 获得道具: ' + (detail.itemName || realEffect), 'success');
  }
  window.addEventListener('allinone-item-redeemed', function(e) { handleRedeemedItem(e.detail); });
  window.addEventListener('allinone:item-redeemed', function(e) { handleRedeemedItem(e.detail); });

  renderCustomPowerUps();
  // 暴露给自动化测试 / 调试
  window.AllinONE = { useCustomPowerUp: useCustomPowerUp, registerDynamicEffect: registerDynamicEffect, handlers: EFFECT_HANDLERS };
})();
</script>
</body>
</html>
