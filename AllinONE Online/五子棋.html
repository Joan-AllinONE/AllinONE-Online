        </div>

            <div class="panel-card">

                <div class="score-row"><span>⚪ AI（白棋）</span><span id="a-score">0</span></div>

    <script>

        const SZ = 15, CELL = 40, PAD = 30, W = CELL * (SZ - 1) + PAD * 2;
        const boardCvs = document.getElementById('board'), boardCtx = boardCvs.getContext('2d');
        const fxCvs = document.getElementById('fx'), fxCtx = fxCvs.getContext('2d');
        boardCvs.width = fxCvs.width = W; boardCvs.height = fxCvs.height = W;
        const bgCvs = document.getElementById('particles-bg'), bgCtx = bgCvs.getContext('2d');
        const fwCvs = document.getElementById('fireworks'), fwCtx = fwCvs.getContext('2d');
        let grid = [], history = [], playerScore = 0, aiScore = 0, gameOver = false, playerTurn = true, animating = false;
        const drops = []; let winLine = null, winFlashT = 0, fireworks = [];

        function initBgParticles() {
            bgCvs.width = innerWidth; bgCvs.height = innerHeight;
            const pts = []; for (let i = 0; i < 60; i++)pts.push({ x: Math.random() * bgCvs.width, y: Math.random() * bgCvs.height, r: Math.random() * 2 + .5, dx: (Math.random() - .5) * .3, dy: (Math.random() - .5) * .3, a: Math.random() * .4 + .1 });
            (function loop() { bgCtx.clearRect(0, 0, bgCvs.width, bgCvs.height); pts.forEach(p => { p.x += p.dx; p.y += p.dy; if (p.x < 0) p.x = bgCvs.width; if (p.x > bgCvs.width) p.x = 0; if (p.y < 0) p.y = bgCvs.height; if (p.y > bgCvs.height) p.y = 0; bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); bgCtx.fillStyle = `rgba(240,194,127,${p.a})`; bgCtx.fill() }); requestAnimationFrame(loop) })();
        }
        initBgParticles(); window.addEventListener('resize', () => { bgCvs.width = innerWidth; bgCvs.height = innerHeight; fwCvs.width = innerWidth; fwCvs.height = innerHeight });
        fwCvs.width = innerWidth; fwCvs.height = innerHeight;

        function resetGrid() { grid = []; for (let i = 0; i < SZ; i++) { grid[i] = []; for (let j = 0; j < SZ; j++)grid[i][j] = 0 } }

        function drawBoard() {
            const ctx = boardCtx; ctx.clearRect(0, 0, W, W);
            // wood bg
            const grd = ctx.createLinearGradient(0, 0, W, W);
            grd.addColorStop(0, '#dbb682'); grd.addColorStop(.5, '#c9a46c'); grd.addColorStop(1, '#b8935a');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, W, W);
            // wood grain
            ctx.save(); ctx.globalAlpha = .12;
            for (let i = 0; i < 40; i++) { ctx.beginPath(); const y = i * (W / 40) + Math.sin(i * .7) * 8; ctx.moveTo(0, y); for (let x = 0; x < W; x += 20)ctx.lineTo(x, y + Math.sin(x * .02 + i) * 4); ctx.strokeStyle = '#8b6914'; ctx.lineWidth = 1.5; ctx.stroke() }
            ctx.restore();
            // grid
            ctx.strokeStyle = 'rgba(60,30,10,.45)'; ctx.lineWidth = 1;
            for (let i = 0; i < SZ; i++) { const p = PAD + i * CELL; ctx.beginPath(); ctx.moveTo(PAD, p); ctx.lineTo(PAD + (SZ - 1) * CELL, p); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p, PAD); ctx.lineTo(p, PAD + (SZ - 1) * CELL); ctx.stroke() }
            // star points
            const stars = [[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]];
            ctx.fillStyle = 'rgba(60,30,10,.55)';
            stars.forEach(([r, c]) => { ctx.beginPath(); ctx.arc(PAD + c * CELL, PAD + r * CELL, 4, 0, Math.PI * 2); ctx.fill() });
            // stones
            for (let r = 0; r < SZ; r++)for (let c = 0; c < SZ; c++)if (grid[r][c]) drawStone(ctx, r, c, grid[r][c], 1, 0);
        }

        function drawStone(ctx, r, c, p, scale, offsetY) {
            const x = PAD + c * CELL, y = PAD + r * CELL + offsetY;
            ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
            // shadow
            ctx.beginPath(); ctx.arc(2, 3, CELL * .42, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fill();
            const g = ctx.createRadialGradient(-4, -4, 2, 0, 0, CELL * .42);
            if (p === 1) { g.addColorStop(0, '#555'); g.addColorStop(1, '#111') }
            else { g.addColorStop(0, '#fff'); g.addColorStop(.8, '#ddd'); g.addColorStop(1, '#bbb') }
            ctx.beginPath(); ctx.arc(0, 0, CELL * .42, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
            // highlight
            ctx.beginPath(); ctx.arc(-5, -5, CELL * .15, 0, Math.PI * 2);
            ctx.fillStyle = p === 1 ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.6)'; ctx.fill();
            ctx.restore();
        }

        function px(r, c) { return { x: PAD + c * CELL, y: PAD + r * CELL } }

        // ===== DROP ANIMATION =====
        function animateDrop(r, c, p, cb) {
            animating = true;
            const target = PAD + r * CELL; const startY = -30;
            let vy = 0; const gravity = 1.8; const bounce = .35; let cy = startY; let settled = 0;
            function frame() {
                vy += gravity; cy += vy;
                if (cy >= target) { cy = target; vy = -vy * bounce; settled++; if (Math.abs(vy) < 2 || settled > 3) { cy = target; animating = false; cb(); return } }
                drawBoard();
                // draw this stone at animated pos
                const oY = cy - target;
                drawStone(boardCtx, r, c, p, 1, oY);
                // temporarily remove from grid for redraw
                requestAnimationFrame(frame);
            }
            grid[r][c] = 0; frame(); grid[r][c] = p;
        }

        // ===== WIN LINE FLASH =====
        function startWinFlash(cells) {
            winLine = cells; winFlashT = 0;
            function flash() {
                if (!winLine) return;
                fxCtx.clearRect(0, 0, W, W);
                winFlashT += .06;
                const alpha = .5 + .5 * Math.sin(winFlashT * 4);
                fxCtx.strokeStyle = `rgba(255,215,0,${alpha})`;
                fxCtx.lineWidth = 6; fxCtx.lineCap = 'round';
                fxCtx.shadowColor = '#ffd700'; fxCtx.shadowBlur = 20;
                fxCtx.beginPath();
                const s = px(cells[0][0], cells[0][1]), e = px(cells[4][0], cells[4][1]);
                fxCtx.moveTo(s.x, s.y); fxCtx.lineTo(e.x, e.y); fxCtx.stroke();
                // glow on stones
                cells.forEach(([cr, cc]) => {
                    fxCtx.beginPath(); const pp = px(cr, cc);
                    fxCtx.arc(pp.x, pp.y, CELL * .5, 0, Math.PI * 2);
                    fxCtx.fillStyle = `rgba(255,215,0,${alpha * .3})`; fxCtx.fill();
                });
                fxCtx.shadowBlur = 0;
                requestAnimationFrame(flash);
            }
            flash();
        }

        // ===== FIREWORKS =====
        class Particle {
            constructor(x, y, hue) {
                this.x = x; this.y = y; this.hue = hue; const ang = Math.random() * Math.PI * 2; const spd = Math.random() * 6 + 2;
                this.vx = Math.cos(ang) * spd; this.vy = Math.sin(ang) * spd; this.alpha = 1; this.decay = Math.random() * .02 + .015; this.size = Math.random() * 3 + 1
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += .05; this.alpha -= this.decay; return this.alpha > 0 }
            draw(ctx) {
                ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue},100%,60%)`; ctx.shadowColor = `hsl(${this.hue},100%,60%)`; ctx.shadowBlur = 10; ctx.fill(); ctx.restore()
            }
        }

        let fwParticles = [];
        function spawnFirework() {
            const x = Math.random() * fwCvs.width, y = Math.random() * fwCvs.height * .5 + 50;
            const hue = Math.random() * 360;
            for (let i = 0; i < 80; i++)fwParticles.push(new Particle(x, y, hue));
        }
        let fwRunning = false;
        function startFireworks() {
            fwRunning = true; fwParticles = [];
            let count = 0;
            const intv = setInterval(() => { spawnFirework(); spawnFirework(); count++; if (count > 12) clearInterval(intv) }, 300);
            function loop() {
                if (!fwRunning) { fwCtx.clearRect(0, 0, fwCvs.width, fwCvs.height); return }
                fwCtx.fillStyle = 'rgba(0,0,0,.08)'; fwCtx.fillRect(0, 0, fwCvs.width, fwCvs.height);
                fwParticles = fwParticles.filter(p => { const alive = p.update(); p.draw(fwCtx); return alive });
                requestAnimationFrame(loop);
            }
            loop();
        }
        function stopFireworks() { fwRunning = false }

        // ===== CHECK WIN =====
        const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
        function checkWin(r, c, p) {
            for (const [dr, dc] of dirs) {
                const cells = [[r, c]];
                for (let i = 1; i < 5; i++) { const nr = r + dr * i, nc = c + dc * i; if (nr < 0 || nr >= SZ || nc < 0 || nc >= SZ || grid[nr][nc] !== p) break; cells.push([nr, nc]) }
                for (let i = 1; i < 5; i++) { const nr = r - dr * i, nc = c - dc * i; if (nr < 0 || nr >= SZ || nc < 0 || nc >= SZ || grid[nr][nc] !== p) break; cells.unshift([nr, nc]) }
                if (cells.length >= 5) return cells.slice(0, 5);
            }
            return null;
        }

        // ===== AI ENGINE (Minimax + Alpha-Beta with pattern scoring) =====
        const SCORE = { FIVE: 1000000, FOUR: 50000, B_FOUR: 8000, THREE: 5000, B_THREE: 800, TWO: 500, B_TWO: 100, ONE: 10 };

        function countPattern(r, c, p, dr, dc) {
            let cnt = 1, block = 0;
            // forward
            let i = 1; while (true) { const nr = r + dr * i, nc = c + dc * i; if (nr < 0 || nr >= SZ || nc < 0 || nc >= SZ) { block++; break } if (grid[nr][nc] === p) { cnt++; i++ } else if (grid[nr][nc] === 0) break; else { block++; break } }
            // backward
            i = 1; while (true) { const nr = r - dr * i, nc = c - dc * i; if (nr < 0 || nr >= SZ || nc < 0 || nc >= SZ) { block++; break } if (grid[nr][nc] === p) { cnt++; i++ } else if (grid[nr][nc] === 0) break; else { block++; break } }
            return { cnt, block };
        }

        function scorePoint(r, c, p) {
            if (grid[r][c] !== 0) return 0;
            grid[r][c] = p; let s = 0;
            for (const [dr, dc] of dirs) {
                const { cnt, block } = countPattern(r, c, p, dr, dc);
                if (cnt >= 5) s += SCORE.FIVE;
                else if (cnt === 4) { s += block === 0 ? SCORE.FOUR : block === 1 ? SCORE.B_FOUR : 0 }
                else if (cnt === 3) { s += block === 0 ? SCORE.THREE : block === 1 ? SCORE.B_THREE : 0 }
                else if (cnt === 2) { s += block === 0 ? SCORE.TWO : block === 1 ? SCORE.B_TWO : 0 }
                else if (cnt === 1) { s += block === 0 ? SCORE.ONE : 0 }
            }
            grid[r][c] = 0; return s;
        }

        function getCandidates() {
            const set = new Set(); const moves = [];
            for (let r = 0; r < SZ; r++)for (let c = 0; c < SZ; c++) {
                if (grid[r][c] !== 0) {
                    for (let dr = -2; dr <= 2; dr++)for (let dc = -2; dc <= 2; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < SZ && nc >= 0 && nc < SZ && grid[nr][nc] === 0) { const k = nr * SZ + nc; if (!set.has(k)) { set.add(k); moves.push([nr, nc]) } }
                    }
                }
            }
            if (moves.length === 0) moves.push([7, 7]);
            // score and sort
            moves.forEach(m => { m[2] = scorePoint(m[0], m[1], 2) + scorePoint(m[0], m[1], 1) * 0.9 });
            moves.sort((a, b) => b[2] - a[2]);
            return moves.slice(0, 15);
        }

        function evaluate() {
            let s = 0;
            for (let r = 0; r < SZ; r++)for (let c = 0; c < SZ; c++) {
                if (grid[r][c] === 0) continue;
                const p = grid[r][c];
                for (const [dr, dc] of dirs) {
                    const { cnt, block } = countPattern(r, c, p, dr, dc);
                    let v = 0;
                    if (cnt >= 5) v = SCORE.FIVE;
                    else if (cnt === 4) v = block === 0 ? SCORE.FOUR : block === 1 ? SCORE.B_FOUR : 0;
                    else if (cnt === 3) v = block === 0 ? SCORE.THREE : block === 1 ? SCORE.B_THREE : 0;
                    else if (cnt === 2) v = block === 0 ? SCORE.TWO : block === 1 ? SCORE.B_TWO : 0;
                    s += p === 2 ? v : -v;
                }
            }
            return s;
        }

        function minimax(depth, alpha, beta, isMax) {
            const cands = getCandidates();
            if (depth === 0) return { score: evaluate() };
            // check immediate win/loss in candidates
            if (isMax) {
                let best = { score: -Infinity };
                for (const [r, c] of cands) {
                    grid[r][c] = 2;
                    const w = checkWin(r, c, 2);
                    if (w) { grid[r][c] = 0; return { score: SCORE.FIVE * 10, r, c } }
                    const val = depth <= 1 ? { score: evaluate() } : minimax(depth - 1, alpha, beta, false);
                    grid[r][c] = 0;
                    if (val.score > best.score) best = { score: val.score, r, c };
                    alpha = Math.max(alpha, val.score); if (alpha >= beta) break;
                }
                return best;
            } else {
                let best = { score: Infinity };
                for (const [r, c] of cands) {
                    grid[r][c] = 1;
                    const w = checkWin(r, c, 1);
                    if (w) { grid[r][c] = 0; return { score: -SCORE.FIVE * 10, r, c } }
                    const val = depth <= 1 ? { score: evaluate() } : minimax(depth - 1, alpha, beta, true);
                    grid[r][c] = 0;
                    if (val.score < best.score) best = { score: val.score, r, c };
                    beta = Math.min(beta, val.score); if (alpha >= beta) break;
                }
                return best;
            }
        }

        function aiMove() {
            const totalStones = grid.flat().filter(x => x).length;
            if (totalStones === 0) { placeStone(7, 7, 2); return }
            // urgency check: if player has open-four or AI can win immediately
            let bestR = -1, bestC = -1, bestS = -Infinity;
            for (let r = 0; r < SZ; r++)for (let c = 0; c < SZ; c++) {
                if (grid[r][c]) continue;
                // AI win?
                grid[r][c] = 2; if (checkWin(r, c, 2)) { grid[r][c] = 0; placeStone(r, c, 2); return } grid[r][c] = 0;
                // Block player win
                grid[r][c] = 1; if (checkWin(r, c, 1)) { grid[r][c] = 0; bestR = r; bestC = c; bestS = Infinity } grid[r][c] = 0;
            }
            if (bestS === Infinity) { placeStone(bestR, bestC, 2); return }
            // depth depends on stage
            const depth = totalStones < 6 ? 4 : totalStones < 20 ? 3 : 2;
            const res = minimax(depth, -Infinity, Infinity, true);
            if (res.r !== undefined) placeStone(res.r, res.c, 2);
        }

        function placeStone(r, c, p) {
            grid[r][c] = p;
            history.push({ r, c, p });
            updateInfo();
            const wc = checkWin(r, c, p);
            animateDrop(r, c, p, () => {
                drawBoard(); drawLastMove();
                if (wc) {
                    gameOver = true;
                    startWinFlash(wc); startFireworks();
                    setTimeout(() => {
                        document.getElementById('overlay').classList.add('active');
                        if (p === 1) { document.getElementById('win-title').textContent = '🎉 你赢了！'; document.getElementById('win-sub').textContent = '恭喜，你战胜了AI！'; playerScore++ }
                        else { document.getElementById('win-title').textContent = '😤 AI 赢了！'; document.getElementById('win-sub').textContent = '再接再厉，下次一定！'; aiScore++ }
                        document.getElementById('p-score').textContent = playerScore;
                        document.getElementById('a-score').textContent = aiScore;
                    }, 800);
                    return;
                }
                if (p === 1) {
                    playerTurn = false;
                    document.getElementById('status-text').style.display = 'none';
                    document.getElementById('thinking').classList.add('active');
                    setTimeout(() => {
                        aiMove();
                        document.getElementById('thinking').classList.remove('active');
                        document.getElementById('status-text').style.display = '';
                        document.getElementById('status-text').textContent = '请落子';
                        playerTurn = true;
                    }, 350);
                }
            });
        }

        function drawLastMove() {
            if (history.length === 0) return;
            const last = history[history.length - 1];
            const p = px(last.r, last.c);
            boardCtx.beginPath(); boardCtx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            boardCtx.fillStyle = 'rgba(255,50,50,.7)'; boardCtx.fill();
        }

        boardCvs.addEventListener('click', e => {
            if (gameOver || !playerTurn || animating) return;
            const rect = boardCvs.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (W / rect.width), my = (e.clientY - rect.top) * (W / rect.height);
            const c = Math.round((mx - PAD) / CELL), r = Math.round((my - PAD) / CELL);
            if (r < 0 || r >= SZ || c < 0 || c >= SZ || grid[r][c]) return;
            placeStone(r, c, 1);
        });

        // hover
        let hoverR = -1, hoverC = -1;
        boardCvs.addEventListener('mousemove', e => {
            if (gameOver || !playerTurn || animating) return;
            const rect = boardCvs.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (W / rect.width), my = (e.clientY - rect.top) * (W / rect.height);
            const c = Math.round((mx - PAD) / CELL), r = Math.round((my - PAD) / CELL);
            if (r !== hoverR || c !== hoverC) {
                hoverR = r; hoverC = c; drawBoard(); drawLastMove();
                if (r >= 0 && r < SZ && c >= 0 && c < SZ && !grid[r][c]) {
                    boardCtx.save(); boardCtx.globalAlpha = .35; drawStone(boardCtx, r, c, 1, 1, 0); boardCtx.restore();
                }
            }
        });

        function updateInfo() {
            document.getElementById('move-count').textContent = history.length;
            document.getElementById('undo-btn').disabled = history.length < 2 || gameOver;
        }

        function undoMove() {
            if (history.length < 2 || gameOver) return;
            // remove AI + player
            for (let i = 0; i < 2; i++) { const m = history.pop(); grid[m.r][m.c] = 0 }
            playerTurn = true; drawBoard(); drawLastMove(); updateInfo();
            document.getElementById('status-text').textContent = '请落子';
        }

        function restartGame() {
            resetGrid(); history = []; gameOver = false; playerTurn = true; animating = false;
            winLine = null; fxCtx.clearRect(0, 0, W, W); stopFireworks();
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('status-text').style.display = '';
            document.getElementById('status-text').textContent = '请落子';
            document.getElementById('thinking').classList.remove('active');
            drawBoard(); updateInfo();
        }

        // init
        resetGrid(); drawBoard(); updateInfo();

    </script>
